services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: myshelf-app:local
    environment:
      SPRING_PROFILES_ACTIVE: local, redis

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    ports:
      - "127.0.0.1:6379:6379"
