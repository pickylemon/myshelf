services:
  postgres:
    image: postgres:17
    container_name: myshelf-postgres
    environment:
      POSTGRES_DB: myshelf
      POSTGRES_USER: myshelf
      POSTGRES_PASSWORD: myshelf123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myshelf -d myshelf"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: