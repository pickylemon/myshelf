services:
  app:
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Spring Boot 환경변수는 application-local.yaml보다 우선 적용됨
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myshelf
      SPRING_DATASOURCE_USERNAME: myshelf
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or shell}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or shell}
      NATIONAL_LIBRARY_API_KEY: ${NATIONAL_LIBRARY_API_KEY:?Set NATIONAL_LIBRARY_API_KEY in .env or shell}
      REDIS_HOST: redis

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: myshelf-postgres
    environment:
      POSTGRES_DB: myshelf
      POSTGRES_USER: myshelf
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or shell}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myshelf -d myshelf"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myshelf-redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
