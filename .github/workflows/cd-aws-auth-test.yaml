
name: CD SSH Deployment Test

on:
  push:
    branches:
      - cd/ec2-deployment
    paths:
      - ".github/workflows/cd-aws-auth-test.yaml"
      - "scripts/deploy-ec2.sh"
      - "compose.yaml"
      - "compose.prod.yaml"

permissions:
  contents: read
  id-token: write

# 동일한 EC2에 여러 배포 작업이 동시에 실행되지 않도록 제한
concurrency:
  group: myshelf-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Compose 파일과 배포 스크립트를 Runner로 가져온다.
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. GitHub OIDC를 이용해 AWS IAM 역할의 임시 자격 증명을 얻는다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}

      # 3. 현재 Runner의 공인 IPv4 주소를 조회한다.
      - name: Get runner public IP
        id: runner-ip
        run: |
          RUNNER_IP=$(curl -4 -fsS https://checkip.amazonaws.com)

          echo "Runner public IP: $RUNNER_IP"
          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      # 4. EC2 보안 그룹에 Runner IP의 SSH 접근을 임시 허용한다.
      # 생성된 규칙 ID는 배포 종료 후 정확히 해당 규칙을 삭제하는 데 사용한다.
      - name: Allow runner SSH access
        id: allow-ssh
        env:
          SG_ID: ${{ vars.EC2_SG_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          RULE_ID=$(aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)

          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"
          echo "Temporary SSH rule created: $RULE_ID"

      # 5. SSH 개인 키와 EC2 호스트 공개 키를 설정한다.
      # known_hosts를 통해 접속 대상 서버의 신원을 검증한다.
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST_KEY: ${{ vars.EC2_SSH_HOST_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/myshelf_cd
          chmod 600 ~/.ssh/myshelf_cd

          printf '%s %s\n' "$EC2_HOST" "$EC2_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 6. EC2로 SSH 접속하여 원격 명령 실행 여부를 확인한다.
      - name: Test EC2 SSH connection
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          ssh -i ~/.ssh/myshelf_cd \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" 'whoami'

      # 7. Compose 파일과 배포 스크립트를 EC2에 복사한다.
      # EC2의 기존 .env 파일은 덮어쓰지 않는다.
      - name: Upload deployment files
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          scp -i ~/.ssh/myshelf_cd \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            compose.yaml \
            compose.prod.yaml \
            scripts/deploy-ec2.sh \
            "$EC2_USER@$EC2_HOST:/opt/myshelf/"

      # 8. EC2에서 배포 스크립트를 실행한다.
      # 이미지 Pull, Compose 실행, HTTP 검증까지 수행한다.
      - name: Deploy MyShelf
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}

          # 테스트 단계: 기존에 게시된 이미지 SHA를 사용한다.
          DEPLOY_SHA: 4e651623b2f855f81d4a023d365632358b0d484b

        run: |
          ssh -i ~/.ssh/myshelf_cd \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            "bash /opt/myshelf/deploy-ec2.sh '$DEPLOY_SHA'"

      # 9. 작업 성공 여부와 관계없이 임시 SSH 접근 규칙을 제거한다.
      # 규칙을 실제로 생성한 경우에만 삭제를 시도한다.
      - name: Remove runner SSH access
        if: ${{ always() && steps.allow-ssh.outputs.rule_id != '' }}
        env:
          SG_ID: ${{ vars.EC2_SG_ID }}
          RULE_ID: ${{ steps.allow-ssh.outputs.rule_id }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --security-group-rule-ids "$RULE_ID"

          echo "Temporary SSH rule removed: $RULE_ID"
