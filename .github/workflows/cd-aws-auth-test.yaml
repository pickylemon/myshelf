
name: CD AWS Authentication Test

on:
  push:
    branches:
      - cd/ec2-deployment
    paths:
      - .github/workflows/cd-aws-auth-test.yaml

permissions:
  contents: read
  id-token: write

jobs:
  aws-auth-test:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect OIDC claims
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })

          with urllib.request.urlopen(req) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}

      - name: Get runner public IP
        id: runner-ip
        run: |
          RUNNER_IP=$(curl -4 -fsS https://checkip.amazonaws.com)
          echo "Runner public IP: $RUNNER_IP"
          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          

      - name: Allow runner SSH access
        id: allow-ssh
        env:
          SG_ID: ${{ vars.EC2_SG_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          RULE_ID=$(aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)

          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"
          echo "Temporary SSH rule created: $RULE_ID"

      - name: Test EC2 SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST_KEY: ${{ vars.EC2_SSH_HOST_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/myshelf_cd
          chmod 600 ~/.ssh/myshelf_cd

          printf '%s %s\n' "$EC2_HOST" "$EC2_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/myshelf_cd \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" 'whoami'

      - name: Remove runner SSH access
        if: ${{ always() && steps.allow-ssh.outputs.rule_id != '' }}
        env:
          SG_ID: ${{ vars.EC2_SG_ID }}
          RULE_ID: ${{ steps.allow-ssh.outputs.rule_id }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --security-group-rule-ids "$RULE_ID"


      - name: Verify AWS identity
        run: aws sts get-caller-identity
