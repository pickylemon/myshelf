name: CD EC2 Deployment

# main의 CI가 완료된 후, 실제 게시까지 모두 성공한 경우에만 실행한다.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: myshelf-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'pickylemon/myshelf'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # GitHub OIDC로 AWS 임시 자격 증명을 획득한다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}

      # SSM에서 ubuntu 사용자로 다운로드·검증·전환·배포를 순차 수행한다.
      # EC2 내부 flock 잠금으로 Actions 타임아웃 후 중복 배포도 방지한다.
      - name: Deploy MyShelf via SSM
        env:
          S3_DEPLOY_BUCKET: ${{ vars.S3_DEPLOY_BUCKET }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_USER: ${{ vars.EC2_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          # GitHub 표현식 등을 셸 명령에 직접 끼워 넣지 않고 JSON으로 인코딩한다.
          python3 - <<'PY'
          import json
          import os
          import re
          import shlex
          from pathlib import Path

          sha = os.environ['DEPLOY_SHA']
          bucket = os.environ['S3_DEPLOY_BUCKET']
          user = os.environ['EC2_USER']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise ValueError('Invalid commit SHA')
          if not re.fullmatch('[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]', bucket):
              raise ValueError('Invalid S3 bucket')
          if not re.fullmatch('[a-z_][a-z0-9_-]*', user):
              raise ValueError('Invalid EC2 user')

          uri = f's3://{bucket}/releases/{sha}/deploy.tar.gz'
          remote = f'''\
          set -Eeuo pipefail
          umask 077
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf -- "$tmp_dir"' EXIT

          # 잠금은 준비부터 배포 종료까지 유지한다.
          exec 9>/opt/myshelf/.deployment.lock
          flock -n 9 || {{ echo 'ERROR: Another deployment is running' >&2; exit 1; }}

          aws --region ap-northeast-2 s3 cp {shlex.quote(uri)} "$tmp_dir/deploy.tar.gz"
          tar -xOzf "$tmp_dir/deploy.tar.gz" prepare-release-ec2.sh > "$tmp_dir/prepare-release-ec2.sh"
          bash "$tmp_dir/prepare-release-ec2.sh" {shlex.quote(sha)} "$tmp_dir/deploy.tar.gz"
          bash /opt/myshelf/releases/{sha}/activate-release-ec2.sh {shlex.quote(sha)}
          '''
          shell_command = f'sudo -u {shlex.quote(user)} -H bash -c {shlex.quote(remote)}'
          params = {'commands': [shell_command], 'executionTimeout': ['720']}
          (Path(os.environ['RUNNER_TEMP']) / 'ssm-params.json').write_text(
              json.dumps(params), encoding='utf-8'
          )
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/ssm-params.json" \
            --timeout-seconds 120 \
            --comment "MyShelf deployment $DEPLOY_SHA" \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"

          # 명령 '전송'이 아닌 EC2 내부의 실제 실행 완료를 확인한다.
          for attempt in {1..165}; do
            if aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --output json > "$RUNNER_TEMP/ssm-result.json" \
              2> "$RUNNER_TEMP/ssm-error.log"; then
              STATUS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["Status"])' "$RUNNER_TEMP/ssm-result.json")
              case "$STATUS" in
                Success|Failed|Cancelled|TimedOut)
                  python3 - "$RUNNER_TEMP/ssm-result.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as file:
              result = json.load(file)
          print('SSM status:', result.get('StatusDetails', result['Status']))
          print('Exit code:', result.get('ResponseCode'))
          for key in ('StandardOutputContent', 'StandardErrorContent'):
              if result.get(key):
                  print(f'--- {key} ---')
                  print(result[key])
          PY
                  if [[ "$STATUS" == 'Success' ]]; then
                    echo 'Deployment succeeded'
                    exit 0
                  fi
                  exit 1
                  ;;
                Pending|InProgress|Delayed|Cancelling)
                  echo "SSM status: $STATUS"
                  ;;
                *)
                  echo "ERROR: Unexpected SSM status: $STATUS" >&2
                  exit 1
                  ;;
              esac
            else
              if ! grep -q 'InvocationDoesNotExist' "$RUNNER_TEMP/ssm-error.log"; then
                cat "$RUNNER_TEMP/ssm-error.log" >&2
                exit 1
              fi
            fi
            sleep 5
          done
          echo "ERROR: SSM result polling timed out ($COMMAND_ID)" >&2
          exit 1
